# Sobe a aplicação completa: Interface (React) + API principal + módulo de câmbio.
# As imagens da API e do câmbio são construídas direto dos repositórios públicos.
#
#   docker compose up --build
#
# Depois acesse http://localhost:8080

services:
  cambio:
    build: https://github.com/gabrielamaiia01/financas-cambio.git#main
    ports:
      - "5001:5001"
    volumes:
      - cambio-dados:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: https://github.com/gabrielamaiia01/financas-api.git#main
    ports:
      - "5000:5000"
    environment:
      CAMBIO_SERVICE_URL: http://cambio:5001
    volumes:
      - api-dados:/data
    depends_on:
      cambio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: .
      args:
        # Endereço da API como o navegador enxerga (porta publicada acima)
        VITE_API_URL: http://localhost:5000
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  cambio-dados:
  api-dados:
